name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Upgrade Gradle, Kotlin & Build APK
        run: |
          PROJECT_DIR=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1 | xargs dirname)
          echo "Found Flutter project in: $PROJECT_DIR"
          cd "$PROJECT_DIR/android"

          # Upgrade Gradle Wrapper to 8.0
          sed -i 's/gradle-.*-all.zip/gradle-8.0-all.zip/g' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/gradle-.*-bin.zip/gradle-8.0-bin.zip/g' gradle/wrapper/gradle-wrapper.properties

          # Enable compileSdk 34 support
          echo "android.suppressUnsupportedCompileSdk=34" >> gradle.properties
          
          # Force update Kotlin version
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.8.22"/g' build.gradle || true
          
          cd ..
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reelzy-app
          path: '**/build/app/outputs/flutter-apk/*.apk'
