name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Force Compatible SDK & Build APK
        run: |
          PROJECT_DIR=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1 | xargs dirname)
          echo "Found project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # Create or update gradle.properties to bypass Kotlin/SDK mismatch checks
          echo "android.suppressUnsupportedCompileSdk=34" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties

          flutter pub get
          flutter build apk --release --no-tree-shake-icons --extra-front-end-options="--no-implicit-dynamic" || flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reelzy-app
          path: '**/build/app/outputs/flutter-apk/*.apk'
