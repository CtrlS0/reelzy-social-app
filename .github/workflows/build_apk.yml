name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK (Debug/Release)
        run: |
          flutter build apk --debug --no-tree-shake-icons || flutter build apk --release --no-tree-shake-icons --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reelzy-app
          path: build/app/outputs/flutter-apk/*.apk
